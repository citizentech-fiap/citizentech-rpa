# Configuração do robô CitizenTech (RPA + IA)
# Caminhos relativos à pasta RPA/.

paths:
  inbox: inbox
  processed: processed
  failed: failed
  outbox: outbox
  corpus: output/corpus/servicos.jsonl
  corpus_cache_dir: output/cache_html
  control_sheet: output/controle.xlsx
  reports_dir: output/relatorios
  logs: logs/robot.log
  models: models
  synthetic: data/synthetic
  genai_path: ../genAI        # pasta do assistente RAG (pacote citizen_rag)

collector:
  timeout_s: 15
  retries: 3
  backoff_s: 2               # espera exponencial: 2, 4, 8...
  user_agent: "CitizenTechBot/1.0 (projeto academico FIAP)"
  offline: false             # true = não acessa a rede, usa só o cache (simula site fora do ar)

classifier:
  min_confidence: 0.45       # abaixo disso -> revisão humana
  min_margin: 0.15           # diferença mínima entre 1º e 2º serviço; abaixo disso = ambíguo -> revisão humana

ocr:
  engine: rapidocr           # rapidocr (pip) | tesseract (opcional, requer instalação)
  min_chars: 20              # texto extraído menor que isso = ilegível
  min_doc_score: 0.5         # confiança mínima para identificar o tipo de documento

responder:
  use_genai: true            # tenta o RAG; se falhar -> template
  llm_timeout_s: 30

email:
  send: false                # false = só gera .eml em outbox/ (rascunho)

# Catálogo de serviços do agricultor familiar do semiárido afetado pela seca.
# documentos_exigidos usa os tipos canônicos de `document_types`, conferidos nas Cartas de Serviço do gov.br.
services:
  - id: garantia_safra
    nome: Acessar o Benefício Garantia-Safra
    orgao: Ministério do Desenvolvimento Agrário e Agricultura Familiar
    url: https://www.gov.br/pt-br/servicos/acessar-o-beneficio-garantia-safra
    documentos_exigidos: [documento_identidade, cpf, caf]
  - id: caf
    nome: Inscrever-se no Cadastro Nacional da Agricultura Familiar (CAF)
    orgao: Ministério do Desenvolvimento Agrário e Agricultura Familiar
    url: https://www.gov.br/pt-br/servicos/cadastrar-se-no-caf-cadastro-nacional-da-agricultura-familiar
    documentos_exigidos: [cpf, comprovante_posse_terra, comprovante_renda]
  - id: pronaf
    nome: Acessar o crédito do Pronaf
    orgao: Ministério do Desenvolvimento Agrário e Agricultura Familiar
    url: https://www.gov.br/pt-br/servicos/acessar-o-programa-nacional-de-fortalecimento-da-agricultura-familiar-pronaf
    documentos_exigidos: [documento_identidade, cpf, caf, comprovante_posse_terra]
  - id: aposentadoria_rural
    nome: Solicitar aposentadoria por idade rural
    orgao: INSS
    url: https://www.gov.br/pt-br/servicos/solicitar-aposentadoria-por-idade-para-trabalhador-rural
    documentos_exigidos: [documento_identidade, cpf]
  - id: salario_maternidade_rural
    nome: Solicitar salário-maternidade rural
    orgao: INSS
    url: https://www.gov.br/pt-br/servicos/solicitar-salario-maternidade-rural
    # A carta exige identificação e CPF; certidão/termo de guarda só nos casos de adoção ou guarda.
    documentos_exigidos: [documento_identidade, cpf]
  - id: cadunico
    nome: Inscrever-se no Cadastro Único
    orgao: Ministério do Desenvolvimento e Assistência Social
    url: https://www.gov.br/pt-br/servicos/inscrever-se-no-cadastro-unico-para-programas-sociais-do-governo-federal
    documentos_exigidos: [documento_identidade, cpf, comprovante_residencia]
  - id: bolsa_familia
    nome: Receber o Bolsa Família
    orgao: Ministério do Desenvolvimento e Assistência Social
    url: https://www.gov.br/pt-br/servicos/receber-o-bolsa-familia
    # A carta remete aos documentos do Cadastro Único.
    documentos_exigidos: [documento_identidade, cpf, comprovante_residencia]
  - id: bpc
    nome: Solicitar o Benefício de Prestação Continuada (BPC)
    orgao: INSS
    url: https://www.gov.br/pt-br/servicos/solicitar-beneficio-assistencial-a-pessoa-com-deficiencia
    documentos_exigidos: [documento_identidade, cpf]
  - id: cpf
    nome: Inscrever ou regularizar o CPF
    orgao: Receita Federal
    url: https://www.gov.br/pt-br/servicos/inscrever-no-cpf
    documentos_exigidos: [documento_identidade, certidao_civil]

document_types:
  documento_identidade: "Documento de identidade com foto (RG, CIN ou CNH)"
  cpf: "CPF"
  comprovante_residencia: "Comprovante de residência"
  certidao_civil: "Certidão de nascimento ou casamento"
  comprovante_renda: "Comprovante de renda"
  caf: "Comprovante de inscrição no CAF (RICAF/extrato)"
  comprovante_posse_terra: "Comprovante de posse ou propriedade da terra (escritura, contrato de arrendamento ou declaração do sindicato)"
