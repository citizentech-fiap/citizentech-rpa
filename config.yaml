# Configuração do robô CitizenTech (RPA + IA)
# Caminhos relativos à pasta RPA/.

paths:
  inbox: inbox
  processed: processed
  failed: failed
  outbox: outbox
  corpus: output/corpus/servicos.jsonl
  corpus_cache_dir: output/cache_html
  control_sheet: output/controle.xlsx
  reports_dir: output/relatorios
  logs: logs/robot.log
  models: models
  synthetic: data/synthetic
  genai_path: ../genAI        # pasta do assistente RAG (pacote citizen_rag)

collector:
  timeout_s: 15
  retries: 3
  backoff_s: 2               # espera exponencial: 2, 4, 8...
  user_agent: "CitizenTechBot/1.0 (projeto academico FIAP)"
  offline: false             # true = não acessa a rede, usa só o cache (simula site fora do ar)

classifier:
  min_confidence: 0.45       # abaixo disso -> revisão humana
  min_margin: 0.15           # diferença mínima entre 1º e 2º serviço; abaixo disso = ambíguo -> revisão humana

ocr:
  engine: rapidocr           # rapidocr (pip) | tesseract (opcional, requer instalação)
  min_chars: 20              # texto extraído menor que isso = ilegível
  min_doc_score: 0.5         # confiança mínima para identificar o tipo de documento

responder:
  use_genai: true            # tenta o RAG; se falhar -> template
  llm_timeout_s: 30

email:
  send: false                # false = só gera .eml em outbox/ (rascunho)

# Catálogo de serviços. documentos_exigidos usa os tipos canônicos de `document_types`.
# A lista foi montada a partir das Cartas de Serviço do gov.br e é conferida pelo coletor.
services:
  - id: seguro_desemprego
    nome: Solicitar o Seguro-Desemprego
    orgao: Ministério do Trabalho e Emprego
    url: https://www.gov.br/pt-br/servicos/solicitar-o-seguro-desemprego
    documentos_exigidos: [cpf, termo_rescisao]
  - id: cadunico
    nome: Inscrever-se no Cadastro Único
    orgao: Ministério do Desenvolvimento e Assistência Social
    url: https://www.gov.br/pt-br/servicos/inscrever-se-no-cadastro-unico-para-programas-sociais-do-governo-federal
    documentos_exigidos: [documento_identidade, cpf, comprovante_residencia]
  - id: passaporte
    nome: Obter passaporte comum
    orgao: Polícia Federal
    url: https://www.gov.br/pt-br/servicos/obter-passaporte-comum-para-brasileiro
    documentos_exigidos: [documento_identidade, cpf, titulo_eleitor, certidao_civil]
  - id: carteira_trabalho_digital
    nome: Obter a Carteira de Trabalho Digital
    orgao: Ministério do Trabalho e Emprego
    url: https://www.gov.br/pt-br/servicos/obter-a-carteira-de-trabalho
    documentos_exigidos: [cpf]
  - id: antecedentes_criminais
    nome: Emitir certidão de antecedentes criminais
    orgao: Polícia Federal
    url: https://www.gov.br/pt-br/servicos/emitir-certidao-de-antecedentes-criminais
    documentos_exigidos: [documento_identidade, cpf]
  - id: mei
    nome: Formalizar-se como Microempreendedor Individual (MEI)
    orgao: Ministério do Empreendedorismo
    url: https://www.gov.br/pt-br/servicos/realizar-registro-como-microempreendedor-individual-mei
    documentos_exigidos: [documento_identidade, cpf]
  - id: cpf
    nome: Inscrever ou regularizar o CPF
    orgao: Receita Federal
    url: https://www.gov.br/pt-br/servicos/inscrever-no-cpf
    documentos_exigidos: [documento_identidade, certidao_civil]
  - id: bpc
    nome: Solicitar o Benefício de Prestação Continuada (BPC)
    orgao: INSS
    url: https://www.gov.br/pt-br/servicos/solicitar-beneficio-assistencial-a-pessoa-com-deficiencia
    documentos_exigidos: [documento_identidade, cpf]
  - id: aposentadoria_idade
    nome: Solicitar aposentadoria por idade
    orgao: INSS
    url: https://www.gov.br/pt-br/servicos/solicitar-aposentadoria-por-idade-trabalhador-urbano
    documentos_exigidos: [documento_identidade, cpf]
  - id: titulo_eleitor
    nome: Emitir o título de eleitor
    # Não há carta federal do TSE no gov.br; usamos a carta do TRE-MT no catálogo estadual do gov.br.
    orgao: Justiça Eleitoral (carta do TRE-MT no catálogo gov.br)
    url: https://www.gov.br/pt-br/servicos-estaduais/servico_estadual?id=20316
    documentos_exigidos: [documento_identidade, comprovante_residencia]

document_types:
  documento_identidade: "Documento de identidade com foto (RG, CNH ou equivalente)"
  cpf: "CPF"
  comprovante_residencia: "Comprovante de residência"
  carteira_trabalho: "Carteira de Trabalho"
  termo_rescisao: "Termo de Rescisão do Contrato de Trabalho (TRCT)"
  titulo_eleitor: "Título de eleitor"
  certidao_civil: "Certidão de nascimento ou casamento"
  comprovante_renda: "Comprovante de renda"
